services:
  taskapi:
    image: taskapi:latest
    build:
      context: .
      pull: true          # always pull the latest sdk:10.0 and aspnet:10.0 (runtime) base images
    pull_policy: build    # use the locally built image; don't try to pull "taskapi" from a registry
    ports:
      - "18080:18080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    volumes:
      - taskdata:/data    # the SQLite file survives container restarts and rebuilds

volumes:
  taskdata:
